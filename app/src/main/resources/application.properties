# =====================================================================
# Projeto DimDim - Grupo lupeol
#
# Nenhum valor default embutido: todas as credenciais chegam por
# variavel de ambiente lida em runtime. Nao ha segredo neste arquivo.
# =====================================================================

# [ADICIONAL - fora da especificacao da Fase 2.3 do roteiro]
# Apenas cosmetico: identifica a aplicacao nos logs. Sem efeito funcional.
spring.application.name=dimdim

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# O DDL e responsabilidade do init.sql. O Hibernate apenas valida o schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A rede publica entre os dois ACIs derruba conexao ociosa.
spring.datasource.hikari.max-lifetime=270000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

server.port=8080
